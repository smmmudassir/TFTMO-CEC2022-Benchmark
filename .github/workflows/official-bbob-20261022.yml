name: Official COCO BBOB Freeze-Before-Test Validation
on:
  push:
    branches:
      - bbob-validation-20261022
    paths:
      - ".github/workflows/official-bbob-20261022.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-bbob:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.2.6 coco-experiment==2.8.3
      - name: Run official COCO evaluator (no synthetic substitution)
        run: python validation/run_official_bbob_zenodo.py 2>&1 | tee official_bbob_run.log
      - name: Upload raw results, manifest and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-bbob-validation-20261022
          path: |
            validation_output/
            official_bbob_run.log
          if-no-files-found: warn
