name: Official COCO BBOB Freeze-Before-Test Validation
on:
  push:
    branches:
      - bbob-validation-20261022
    paths:
      - ".github/workflows/official-bbob-20261022.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-bbob:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official evaluator (published version)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "coco-experiment==2.8.2"
          python -c "import cocoex; print('COCO evaluator imported successfully:', getattr(cocoex,'__version__','version unexposed'))"
      - name: Run official COCO evaluator (frozen source must match its SHA)
        shell: bash
        run: |
          set -euo pipefail
          python -u validation/run_official_bbob_zenodo.py 2>&1 | tee official_bbob_run.log
      - name: Verify complete 2160-row BBOB dataset and manifest
        run: python validation/verify_official_bbob_results.py
      - name: Upload raw results, manifest and logs (including failure diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-bbob-validation-20261022
          path: |
            validation_output/
            official_bbob_run.log
          if-no-files-found: warn
